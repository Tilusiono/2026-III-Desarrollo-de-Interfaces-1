<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

</head>
<body>

    <h1>Formulario de registro</h1>

    <form id="formularioRegistro2">

        <label for="nombre">Nombre:</label>
        <input type="text" value="Ezequiel" id="nombre" name="nombre">

        <br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" value="Soriano" id="apellido" name="apellido">

        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" value="ejemplo@gmail.com" id="correo" name="correo">

        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" value="+51 979749422" id="telefono" name="telefono">

        <br><br>

        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date" value="2006-08-08" id="fechaNacimiento" name="fechaNacimiento">

        <br><br>

        <label for="genero">Género:</label>
        <select id="genero" name="genero">
            <option value="">Seleccione una opción</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
        </select>

        <br><br>

        <label for="mensaje">Mensaje:</label>
        <br>
        <textarea id="mensaje"  name="mensaje" rows="5" cols="40">escribe un comentario</textarea>

        <br><br>

        <button type="submit" id="btnEnviar">Enviar</button>
        <button type="reset" id="btnLimpiar">Limpiar</button>

    </form>
    <script src="js/clase1.js"></script>
</body>
</html>

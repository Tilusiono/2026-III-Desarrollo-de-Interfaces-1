<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body class="bg-light">

    <header class="bg-primary text-white py-4">
        <section class="container">
            <h1 class="h2 mb-1">
                <i class="bi bi-person-plus-fill"></i>
                Formulario de Registro
            </h1>
            <p class="mb-0">Ingrese sus datos personales para registrarse.</p>
        </section>
    </header>

    <main class="container py-4">
        <section class="card shadow-sm mb-4">
            <header class="card-header bg-white">
                <h2 class="h5 mb-0">
                    <i class="bi bi-person-vcard"></i>
                    Datos personales
                </h2>
            </header>

            <section class="card-body">
                <form id="formularioRegistro">
                    <fieldset class="border-0 p-0 m-0">
                        <legend class="visually-hidden">Información personal del usuario</legend>

                        <section class="mb-3">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="Bernabe Daniel" placeholder="Ingrese sus nombres" required>
                        </section>

                        <section class="mb-3">
                            <label for="apellido" class="form-label">Apellidos:</label>
                            <input type="text" class="form-control" id="apellido" name="apellido" value="Inche Ticlavilca" placeholder="Ingrese sus apellidos" required>
                        </section>

                        <section class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico:</label>
                            <input type="email" class="form-control" id="correo" name="correo" value="fbinche@idat.pe" placeholder="ejemplo@correo.com" required>
                        </section>

                        <section class="mb-3">
                            <label for="telefono" class="form-label">Teléfono:</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" value="919759571" placeholder="999999999" required>
                        </section>

                        <section class="mb-3">
                            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento:</label>
                            <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" value="1993-08-28" required>
                        </section>

                        <section class="mb-3">
                            <label for="genero" class="form-label">Género:</label>
                            <select class="form-select" id="genero" name="genero" required>
                                <option value="">Seleccione una opción</option>
                                <option value="masculino" selected>Masculino</option>
                                <option value="femenino">Femenino</option>
                                <option value="otro">Otro</option>
                            </select>
                        </section>

                        <section class="mb-3">
                            <label for="tipoUsuario" class="form-label">Tipo de usuario:</label>
                            <select class="form-select" id="tipoUsuario" name="tipoUsuario" required>
                                <option value="">Seleccione una opción</option>
                                <option value="alumno">Alumno</option>
                                <option value="maestro">Maestro</option>
                                <option value="personalApoyo">Personal de apoyo</option>
                                <option value="soporteTI">Soporte TI</option>
                            </select>
                        </section>

                        <section class="mb-4">
                            <label for="mensaje" class="form-label">Mensaje:</label>
                            <textarea class="form-control" id="mensaje" name="mensaje" rows="5" required>Mensaje de prueba.</textarea>
                        </section>
                    </fieldset>

                    <section class="d-flex flex-wrap gap-2">
                        <button type="submit" id="btnEnviar" class="btn btn-primary">
                            <i class="bi bi-send-fill"></i> Enviar
                        </button>
                        <button type="reset" id="btnLimpiar" class="btn btn-outline-secondary">
                            <i class="bi bi-eraser-fill"></i> Restaurar valores
                        </button>
                    </section>
                </form>
            </section>
        </section>

        <section id="resultadoFormulario" class="card shadow-sm mb-4">
            <header class="card-header bg-white">
                <h2 class="h5 mb-0">
                    Usuarios registrados: <span id="totalUsuarios">0</span>
                </h2>
            </header>
            <section class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">N.º</th>
                                <th scope="col">Nombre completo</th>
                                <th scope="col">Correo</th>
                                <th scope="col">Teléfono</th>
                                <th scope="col">Nacimiento</th>
                                <th scope="col">Género</th>
                                <th scope="col">Rol</th>
                                <th scope="col">Descripción del rol</th>
                                <th scope="col">Mensaje / Acción</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoResultado"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0"><small>Formulario de Registro &copy; 2026</small></p>
    </footer>

    <script type="module" src="/js/app.js"></script>
</body>

</html>

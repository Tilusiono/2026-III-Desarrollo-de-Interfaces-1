<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Power Gym</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #050505;
            color: white;
        }

        /* =========================
           BARRA DE NAVEGACIÓN
        ========================= */

        header {
            height: 70px;
            background-color: #050505;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid #292929;
            position: relative;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 38px;
            color: #ffd000;
        }

        .logo h1 {
            font-size: 27px;
            font-style: italic;
            font-weight: 900;
        }

        .logo span {
            color: #ffd000;
        }

        /* MENÚ */

        nav {
            display: flex;
            gap: 45px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 24px 0;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffd000;
        }

        nav a.activo {
            color: white;
            border-bottom: 3px solid #ffd000;
        }

        /* BOTÓN UNETE */

        .btn-unete {
            border: 2px solid #ffd000;
            color: #ffd000;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-unete:hover {
            background-color: #ffd000;
            color: #000;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            height: calc(100vh - 70px);
            min-height: 650px;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.65)
                ),
                url("gym-fondo.png");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            position: relative;
        }

        .contenido {
            width: 700px;
            margin-top: -30px;
        }

        /* ICONO PRINCIPAL */

        .icono-principal {
            font-size: 120px;
            color: #ffd000;
            margin-bottom: 10px;
        }

        /* TITULO */

        .titulo {
            font-size: 85px;
            font-weight: 900;
            font-style: italic;
            line-height: 0.9;
            letter-spacing: -4px;
        }

        .titulo .amarillo {
            color: #ffd000;
        }

        /* FRASE */

        .frase {
            margin-top: 25px;
            font-size: 20px;
            letter-spacing: 8px;
            font-weight: bold;
        }

        .frase span {
            color: #ffd000;
            margin: 0 15px;
        }

        /* SUBTITULO */

        .subtitulo {
            margin-top: 35px;
            font-size: 30px;
            font-style: italic;
            font-weight: bold;
        }

        .subtitulo span {
            display: block;
            color: #ffd000;
            font-size: 43px;
            font-family: cursive;
            margin-top: 5px;
        }

        /* BOTÓN ENTRENAR */

        .btn-entrenar {
            display: inline-block;
            margin-top: 30px;
            background-color: #ffd000;
            color: #000;
            text-decoration: none;
            padding: 17px 55px;
            border-radius: 35px;
            font-size: 17px;
            font-weight: 900;
            transition: 0.3s;
        }

        .btn-entrenar:hover {
            transform: scale(1.05);
            background-color: #fff;
        }

        .btn-entrenar i {
            margin-left: 10px;
        }

        /* =========================
           BENEFICIOS
        ========================= */

        .beneficios {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            width: 750px;
            justify-content: space-between;
        }

        .beneficio {
            width: 180px;
            text-align: center;
            border-right: 1px solid #ffd000;
        }

        .beneficio:last-child {
            border-right: none;
        }

        .beneficio i {
            font-size: 35px;
            color: #ffd000;
        }

        .beneficio p {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.3;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            header {
                padding: 0 20px;
            }

            nav {
                display: none;
            }

            .titulo {
                font-size: 60px;
            }

            .contenido {
                width: 90%;
            }

            .beneficios {
                width: 90%;
            }

        }

        @media (max-width: 600px) {

            .logo h1 {
                font-size: 20px;
            }

            .logo i {
                font-size: 28px;
            }

            .btn-unete {
                padding: 8px 12px;
                font-size: 13px;
            }

            .titulo {
                font-size: 45px;
            }

            .icono-principal {
                font-size: 80px;
            }

            .frase {
                font-size: 13px;
                letter-spacing: 3px;
            }

            .subtitulo {
                font-size: 22px;
            }

            .subtitulo span {
                font-size: 30px;
            }

            .beneficios {
                bottom: 15px;
            }

            .beneficio {
                width: 25%;
            }

            .beneficio i {
                font-size: 24px;
            }

            .beneficio p {
                font-size: 9px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         MENÚ
    ========================= -->

    <header>

        <div class="logo">

            <i class="bi bi-barbell"></i>

            <h1>
                POWER <span>GYM</span>
            </h1>

        </div>

        <nav>

            <a href="#" class="activo">Inicio</a>

            <a href="#">Nosotros</a>

            <a href="#">Servicios</a>

            <a href="#">Horarios</a>

            <a href="#">Contacto</a>

        </nav>

        <a href="#" class="btn-unete">
            <i class="bi bi-person"></i>
            Únete ahora
        </a>

    </header>


    <!-- =========================
         PRINCIPAL
    ========================= -->

    <section class="hero">

        <div class="contenido">

            <!-- PESA -->

            <div class="icono-principal">
                <i class="bi bi-barbell"></i>
            </div>


            <!-- TITULO -->

            <h2 class="titulo">
                POWER <span class="amarillo">GYM</span>
            </h2>


            <!-- FRASE -->

            <div class="frase">

                DISCIPLINA

                <span>•</span>

                ESFUERZO

                <span>•</span>

                RESULTADOS

            </div>


            <!-- SUBTITULO -->

            <div class="subtitulo">

                TU MEJOR VERSIÓN

                <span>EMPIEZA AQUÍ</span>

            </div>


            <!-- BOTÓN -->

            <a href="#" class="btn-entrenar">

                ENTRENA HOY

                <i class="bi bi-arrow-right"></i>

            </a>

        </div>


        <!-- =========================
             BENEFICIOS
        ========================= -->

        <div class="beneficios">

            <div class="beneficio">

                <i class="bi bi-barbell"></i>

                <p>
                    EQUIPOS<br>
                    DE ALTA CALIDAD
                </p>

            </div>


            <div class="beneficio">

                <i class="bi bi-person-check"></i>

                <p>
                    ENTRENADORES<br>
                    PROFESIONALES
                </p>

            </div>


            <div class="beneficio">

                <i class="bi bi-shield-check"></i>

                <p>
                    AMBIENTE SEGURO<br>
                    Y MOTIVADOR
                </p>

            </div>


            <div class="beneficio">

                <i class="bi bi-graph-up-arrow"></i>

                <p>
                    RESULTADOS<br>
                    REALES
                </p>

            </div>

        </div>

    </section>

</body>
</html>

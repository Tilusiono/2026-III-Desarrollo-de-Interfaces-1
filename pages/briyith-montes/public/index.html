<!DOCTYPE html>
<html>
<head>
  <title>Prueba Visual</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <style>
    body{
      background:linear-gradient(135deg,#111827,#7c3aed);
      color:white;text-align:center;
      font-family:Arial;padding:50px;
    }

    .box{
      padding:30px;
      background:#ffffff22;
      border-radius:20px;
    }

    .icono{
      font-size:60px;
    }

    button{
      padding:12px 20px;
      border:0;
      border-radius:10px;
      background:#a78bfa;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <i class="bi bi-apple icono"></i>

    <h1>Prueba Visual</h1>
    <p>HTML sencillo y bonito</p>

    <button onclick="alert('¡Funciona!')">
      Probar
    </button>
  </div>

</body>
</html>

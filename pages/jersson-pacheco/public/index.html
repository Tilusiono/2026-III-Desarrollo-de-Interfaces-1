<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitGym | Reserva de Clases</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body class="bg-light">

  <header class="bg-dark text-white py-3 mb-4">
    <section class="container d-flex justify-content-between align-items-center">
      <h1 class="h3 m-0">FitGym</h1>
      <span class="badge bg-primary fs-6">Reserva de Sesiones</span>
    </section>
  </header>

  <main class="container">
    
    <!-- Formulario de Registro / Edición -->
    <section class="card p-4 mb-5 shadow-sm" id="seccionFormulario">
      <h2 class="h4 mb-3">Reserva tu Cupo</h2>
      
      <form id="formReserva" class="row g-3">
        <!-- Campo oculto para saber si estamos editando un ID existente -->
        <input type="hidden" id="editandoId">

        <section class="col-md-6">
          <label for="nombre" class="form-label">Nombre</label>
          <input id="nombre" class="form-control" required maxlength="50">
        </section>
        
        <section class="col-md-6">
          <label for="apellido" class="form-label">Apellido</label>
          <input id="apellido" class="form-control" required maxlength="50">
        </section>
        
        <section class="col-md-6">
          <label for="correo" class="form-label">Correo Electrónico</label>
          <input id="correo" class="form-control" type="email" required>
        </section>
        
        <section class="col-md-6">
          <label for="telefono" class="form-label">Teléfono</label>
          <input id="telefono" class="form-control" type="tel" required>
        </section>
        
        <section class="col-12">
          <label for="claseSelect" class="form-label">Selecciona la Clase</label>
          <select id="claseSelect" class="form-select" required>
            <option value="">Selecciona una clase</option>
            <option value="CrossFit (07:00 AM)">CrossFit (07:00 AM)</option>
            <option value="Yoga & Estiramiento (09:00 AM)">Yoga & Estiramiento (09:00 AM)</option>
            <option value="Spinning (06:00 PM)">Spinning (06:00 PM)</option>
            <option value="Pilates (05:00 PM)">Pilates (05:00 PM)</option>
          </select>
        </section>
        
        <section class="col-12">
          <button class="btn btn-primary" type="submit">Guardar Reserva</button>
        </section>
      </form>
    </section>

    <!-- Tabla de Reservas -->
    <section class="card p-4 mb-5 shadow-sm">
      <h2 class="h4 mb-3">Mis Reservas Activas</h2>
      <section class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Participante</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Clase</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaReservas">
            <!-- Se llena con JavaScript -->
          </tbody>
        </table>
      </section>
    </section>

  </main>

  <footer class="text-center py-4 text-secondary border-top">
    FitGym · Proyecto Académico de Desarrollo de Interfaces
  </footer>

  <script type="module" src="../js/app.js"></script>
</body>
</html>

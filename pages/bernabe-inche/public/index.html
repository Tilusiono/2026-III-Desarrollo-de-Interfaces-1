<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <script src="js/clase1.js" defer></script>
</head>

<body>

    <h1>Formulario de registro</h1>

    <form id="formularioRegistro">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="bernabe" pattern="[A-Za-z\s]+"
            title="Solo se permiten letras y espacios.">

        <br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" value="inche" pattern="[A-Za-z\s]+"
            title="Solo se permiten letras y espacios.">

        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" value="bernabe.inche@idat.com">

        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" value="987654321" maxlength="9" pattern="[0-9]{9}">

        <br><br>

        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento" value="1993-08-18" pattern="\d{4}-\d{2}-\d{2}"
            title="Formato: AAAA-MM-DD">

        <br><br>

        <label for="genero">Género:</label>
        <select id="genero" name="genero">
            <option value="">Seleccione una opción</option>
            <option value="M" selected>Masculino</option>
            <option value="F">Femenino</option>
            <option value="X">Otro</option>
        </select>

        <br><br>

        <label for="mensaje">Mensaje:</label>
        <br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40" pattern=".*"
            title="Este campo es obligatorio."> Estoy interesado en el servicio.</textarea>

        <br><br>

        <button type="submit" id="btnEnviar">Enviar</button>
        <button type="reset" id="btnLimpiar">Limpiar</button>

    </form>
    
    <section id="resultadoFormulario" aria-live="polite" hidden>
        <h2>Datos obtenidos del formulario</h2>

        <table border="1">
            <thead>
                <tr>
                    <th>Campo</th>
                    <th>Valor</th>
                    <th>Tipo JavaScript</th>
                </tr>
            </thead>

            <tbody id="cuerpoResultado">
            </tbody>
        </table>
    </section>
</body>

</html>

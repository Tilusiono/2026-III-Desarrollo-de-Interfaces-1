<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de registro</title>

  <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>

<body>
  <main class="container py-5">
    <section class="card shadow-sm border-0 p-4 p-md-5">
      <h1 class="h2 mb-4">Formulario de registro</h1>

      <form id="formularioRegistro">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            class="form-control"
            minlength="2"
            maxlength="80"
            required
          >
        </div>

        <div class="mb-3">
          <label for="apellido" class="form-label">Apellidos</label>
          <input
            id="apellido"
            name="apellido"
            type="text"
            class="form-control"
            minlength="2"
            maxlength="100"
            required
          >
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input
            id="correo"
            name="correo"
            type="email"
            class="form-control"
            required
          >
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label">Número de contacto</label>
          <input
            id="telefono"
            name="telefono"
            type="tel"
            class="form-control"
            inputmode="numeric"
            pattern="[0-9]{9}"
            title="Ingresa un teléfono de 9 dígitos"
            required
          >
        </div>

        <div class="mb-3">
          <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
          <input
            id="fechaNacimiento"
            name="fechaNacimiento"
            type="date"
            class="form-control"
            required
          >
        </div>

        <div class="mb-3">
          <label for="genero" class="form-label">Género</label>
          <select id="genero" name="genero" class="form-select" required>
            <option value="">Selecciona una opción</option>
            <option value="Femenino">Femenino</option>
            <option value="Masculino">Masculino</option>
            <option value="Otro">Otro</option>
            <option value="Prefiero no decirlo">Prefiero no decirlo</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea
            id="mensaje"
            name="mensaje"
            class="form-control"
            rows="4"
            maxlength="500"
            required
          ></textarea>
        </div>

        <div class="mb-4">
          <label for="numero1" class="form-label">Número</label>
          <input
            id="numero1"
            name="numero1"
            type="number"
            class="form-control"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary me-2">Enviar</button>
        <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
      </form>

      <section id="resultadoFormulario" class="mt-5" hidden>
        <h2 class="h4 mb-3">Datos ingresados</h2>

        <div class="table-responsive">
          <table class="table table-striped table-bordered">
            <thead class="table-light">
              <tr>
                <th>Campo</th>
                <th>Valor</th>
                <th>Tipo</th>
              </tr>
            </thead>
            <tbody id="cuerpoResultado"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="/js/app.js" defer></script>
</body>
</html>

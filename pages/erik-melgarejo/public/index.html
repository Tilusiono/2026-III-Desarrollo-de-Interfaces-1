<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de registro</title>

    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body>
    <main class="container py-5">
        <section class="card shadow-sm border-0 p-4 p-md-5">
            <h1 class="h2 mb-4">Formulario de registro</h1>

            <form id="formularioRegistro">
                <div class="mb-3 rol-selector">
                    <label for="rol" class="form-label">Primero, selecciona tu rol</label>
                    <select id="rol" name="rol" class="form-select" required>
                        <option value="">Selecciona un rol</option>
                        <option value="estudiante">Estudiante</option>
                        <option value="profesor">Profesor</option>
                        <option value="recursos-humanos">Recursos Humanos</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <fieldset id="camposFormulario" hidden disabled>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        class="form-control"
                        minlength="2"
                        maxlength="80"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="apellido" class="form-label">Apellidos</label>
                    <input
                        id="apellido"
                        name="apellido"
                        type="text"
                        class="form-control"
                        minlength="2"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="usuario" class="form-label">Nombre de usuario</label>
                    <input
                        id="usuario"
                        name="usuario"
                        type="text"
                        class="form-control"
                        minlength="4"
                        maxlength="30"
                        autocomplete="username"
                        required
                    >
                    <div class="form-text">Debe tener entre 4 y 30 caracteres.</div>
                </div>

                <fieldset class="mb-3" data-rol="estudiante" hidden disabled>
                    <legend class="h6">Datos de estudiante</legend>
                    <div class="mb-3">
                        <label for="codigoEstudiante" class="form-label">Código de estudiante</label>
                        <input id="codigoEstudiante" name="codigoEstudiante" type="text" class="form-control" data-campo-rol maxlength="30" required>
                    </div>
                    <div>
                        <label for="carrera" class="form-label">Carrera</label>
                        <input id="carrera" name="carrera" type="text" class="form-control" data-campo-rol maxlength="80" required>
                    </div>
                </fieldset>

                <fieldset class="mb-3" data-rol="profesor" hidden disabled>
                    <legend class="h6">Datos de profesor</legend>
                    <div class="mb-3">
                        <label for="especialidad" class="form-label">Especialidad</label>
                        <input id="especialidad" name="especialidad" type="text" class="form-control" data-campo-rol maxlength="80" required>
                    </div>
                    <div>
                        <label for="gradoAcademico" class="form-label">Grado académico</label>
                        <input id="gradoAcademico" name="gradoAcademico" type="text" class="form-control" data-campo-rol maxlength="80" required>
                    </div>
                </fieldset>

                <fieldset class="mb-3" data-rol="recursos-humanos" hidden disabled>
                    <legend class="h6">Datos de Recursos Humanos</legend>
                    <div class="mb-3">
                        <label for="departamento" class="form-label">Departamento</label>
                        <input id="departamento" name="departamento" type="text" class="form-control" data-campo-rol maxlength="80" required>
                    </div>
                    <div>
                        <label for="cargo" class="form-label">Cargo</label>
                        <input id="cargo" name="cargo" type="text" class="form-control" data-campo-rol maxlength="80" required>
                    </div>
                </fieldset>

                <fieldset class="mb-3" data-rol="otro" hidden disabled>
                    <legend class="h6">Otros datos</legend>
                    <div class="mb-3">
                        <label for="rolEspecifico" class="form-label">Especifica el rol</label>
                        <input id="rolEspecifico" name="rolEspecifico" type="text" class="form-control" data-campo-rol maxlength="80" required>
                    </div>
                    <div>
                        <label for="datosAdicionales" class="form-label">Datos adicionales</label>
                        <input id="datosAdicionales" name="datosAdicionales" type="text" class="form-control" data-campo-rol maxlength="120" required>
                    </div>
                </fieldset>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input
                        id="correo"
                        name="correo"
                        type="email"
                        class="form-control"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Número de contacto</label>
                    <input
                        id="telefono"
                        name="telefono"
                        type="tel"
                        class="form-control"
                        inputmode="numeric"
                        pattern="[0-9]{9}"
                        title="Ingresa un teléfono de 9 dígitos"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                    <input
                        id="fechaNacimiento"
                        name="fechaNacimiento"
                        type="date"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="genero" class="form-label">Género</label>
                    <select id="genero" name="genero" class="form-select" required>
                        <option value="">Selecciona una opción</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Otro">Otro</option>
                        <option value="Prefiero no decirlo">Prefiero no decirlo</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input
                        id="contrasena"
                        name="contrasena"
                        type="password"
                        class="form-control"
                        minlength="8"
                        autocomplete="new-password"
                        aria-describedby="ayudaContrasena"
                        required
                    >
                    <div id="ayudaContrasena" class="form-text">
                        Debe tener al menos 8 caracteres.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmarContrasena" class="form-label">
                        Confirmar contraseña
                    </label>
                    <input
                        id="confirmarContrasena"
                        name="confirmarContrasena"
                        type="password"
                        class="form-control"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        class="form-control"
                        rows="4"
                        maxlength="500"
                        required
                    ></textarea>
                </div>

                <div class="form-check mb-4">
                    <input
                        id="aceptaTerminos"
                        name="aceptaTerminos"
                        type="checkbox"
                        class="form-check-input"
                        required
                    >
                    <label for="aceptaTerminos" class="form-check-label">
                        Acepto los términos y condiciones
                    </label>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" class="btn btn-primary me-2">Enviar</button>
                    <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
                </div>
                </fieldset>
            </form>

            <section id="resultadoFormulario" class="mt-5" hidden>
                <h2 class="h4 mb-3">Datos ingresados</h2>

                <div class="table-responsive">
                    <table class="table table-striped table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Campo</th>
                                <th>Valor</th>
                                <th>Tipo</th>
                                <th>Validacion</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoResultado"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <script type="module" src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Odontológica - Sistema de Admisión</title>
    <!-- Enlace a tus estilos CSS independientes -->
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="main-header">
        <h1>Clínica Odontológica DentalSalud</h1>
        <p>Panel de Control y Registro de Pacientes</p>
    </header>

    <div class="contenedor-principal">
        
        <!-- SECCIÓN 1: FORMULARIO DE REGISTRO DE PACIENTE -->
        <main class="panel-formulario">
            <h2>1. Registro de Admisión</h2>
            <form id="form-registro" novalidate>
                <div class="campo-grupo">
                    <label for="input-nombre">Nombre Completo:</label>
                    <input type="text" id="input-nombre" placeholder="Ej. Juan Pérez">
                </div>

                <div class="campo-grupo">
                    <label for="input-correo">Correo Electrónico:</label>
                    <input type="text" id="input-correo" placeholder="juan.perez@correo.com">
                </div>

                <div class="campo-grupo">
                    <label for="select-servicio">Especialidad Requerida:</label>
                    <select id="select-servicio">
                        <option value="Todos">Ver Todas las Especialidades</option>
                        <option value="Odontología General">Odontología General</option>
                        <option value="Ortodoncia">Ortodoncia</option>
                        <option value="Odontopediatría">Odontopediatría</option>
                    </select>
                </div>
                
                <!-- Contenedores dinámicos para alertas de la rúbrica -->
                <div id="mensaje-error" class="alerta alerta-error"></div>
                <div id="mensaje-exito" class="alerta alerta-exito"></div>

                <button type="submit" class="btn-primario">Registrar Paciente</button>
            </form>

            <!-- PANEL DE SEGUIMIENTO (HISTORIAL DE CITAS) -->
            <div class="panel-historial">
                <h3>Citas Programadas (<span id="contador-citas">0</span>)</h3>
                <ul id="lista-citas">
                    <li id="ticket-vacio" class="vacio-texto">No hay pacientes citados en el sistema actualmente.</li>
                </ul>
            </div>
        </main>

        <!-- SECCIÓN 2: CATÁLOGO DE ATENCIONES Y FILTROS -->
        <section class="panel-catalogo">
            <h2>2. Horarios y Turnos Disponibles</h2>
            
            <!-- Botones de Navegación/Filtro exigidos por la rúbrica -->
            <div class="filtros-container">
                <button class="btn-filtro active" data-categoria="Todos">Todos</button>
                <button class="btn-filtro" data-categoria="Odontología General">General</button>
                <button class="btn-filtro" data-categoria="Ortodoncia">Ortodoncia</button>
                <button class="btn-filtro" data-categoria="Odontopediatría">Pediatría</button>
            </div>

            <!-- Contenedor dinámico para las tarjetas de atención -->
            <div id="contenedor-atenciones" class="grid-atenciones"></div>
        </section>

    </div>

    <!-- Vinculación a tu script principal -->
    <script type="module" src="../js/CLASE_01.js"></script>
</body>
</html>

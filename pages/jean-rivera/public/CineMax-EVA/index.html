<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineMax | Eventos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a class="brand" href="#">Cine<span>Max</span></a>
      <span class="small">Eventos y experiencias</span>
    </div>
  </header>

  <main class="container py-4">
    <section class="hero mb-4">
      <p class="tag">VIVE ALGO DIFERENTE</p>
      <h1>Encuentra tu próximo evento</h1>
      <p>Explora actividades y reserva tu lugar.</p>
    </section>

    <section class="mb-4">
      <h2>Eventos disponibles</h2>
      <div class="row g-2 mb-3">
        <div class="col-md-8">
          <input id="buscar" class="form-control" type="search" placeholder="Buscar por nombre..." aria-label="Buscar evento">
        </div>
        <div class="col-md-4">
          <select id="categoria" class="form-select" aria-label="Filtrar por categoría">
            <option value="todos">Todas las categorías</option>
            <option value="cine">Cine</option>
            <option value="taller">Taller</option>
            <option value="charla">Charla</option>
          </select>
        </div>
      </div>
      <div id="listaEventos" class="row g-3"></div>
    </section>

    <section class="panel mb-4" id="formulario">
      <h2>Inscríbete a un evento</h2>
      <form id="formInscripcion" class="row g-3">
        <div class="col-md-6">
          <label for="nombre" class="form-label">Nombre</label>
          <input id="nombre" class="form-control" required maxlength="60">
        </div>
        <div class="col-md-6">
          <label for="apellido" class="form-label">Apellido</label>
          <input id="apellido" class="form-control" required maxlength="60">
        </div>
        <div class="col-md-6">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input id="correo" class="form-control" type="email" required>
        </div>
        <div class="col-md-6">
          <label for="telefono" class="form-label">Teléfono</label>
          <input id="telefono" class="form-control" type="tel" required>
        </div>
        <div class="col-12">
          <label for="evento" class="form-label">Evento</label>
          <select id="evento" class="form-select" required>
            <option value="">Selecciona un evento</option>
          </select>
        </div>
        <div class="col-12 form-check ms-2">
          <input id="confirmar" class="form-check-input" type="checkbox" required>
          <label class="form-check-label" for="confirmar">Confirmo mis datos e inscripción.</label>
        </div>
        <div class="col-12">
          <button class="btn btn-cine" type="submit">Inscribirme</button>
        </div>
      </form>
      <p id="mensaje" class="mt-3 mb-0" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2>Mis inscripciones</h2>
      <div id="misInscripciones"><p class="muted">Aún no tienes inscripciones.</p></div>
    </section>
  </main>

  <footer class="text-center py-4">CineMax · Proyecto académico</footer>
  <script src="app.js"></script>
</body>
</html>

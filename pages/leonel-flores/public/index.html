<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

    <h1>Formulario de registro</h1>

    <form id="formularioRegistro">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" value="Leonel" name="nombre">

        <br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" value="Flores" name="apellido">

        <br><br>

        <label for="correo">correo:</label>
        <input type="email" id="correo" value="at70707637@idat.pe" name="correo">

        <br><br>

        <label for="telefono">tell:</label>
        <input type="tel" id="telefono" value="972556554" name="telefono">

        <br><br>

        <label for="fechaNacimiento">fechaNacimiento:</label>
        <input type="date" id="fechaNacimiento" value="/04/06/2007" name="fechaNacimiento">

        <br><br>

        <label for="genero">Hombre:</label>
        <select id="genero" name="genero">
            <option value="">Seleccione una opción</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
        </select>

        <br><br>

        <label for="mensaje">Mensaje:</label>
        <br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>

        <br><br>

        <button type="submit" id="btnEnviar">Enviar</button>
        <button type="reset" id="btnLimpiar">Limpiar</button>

    </form>

    <script src="js/clase2.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/assets/bootstrap-icons/bootstrap-icons.min.css">
    
</head>
<body>
    <h1>Formulario de Registro</h1>
    <form id="formularioRegistro45">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="César">

        <br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" value="Yauri">

        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" value="AT73214869@idat.pe">

        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" value="958156325">

        <br><br>

        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento" value="2004-06-28">

        <br><br>

        <label for="genero">Género:</label>
        <select id="genero" name="genero">
            <option value="">Seleccione una opción</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
        </select>

        <br><br>

        <label for="mensaje">Mensaje:</label>
        <br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40">Mensaje de prueba.</textarea>

        <br><br>

        <button type="submit" id="btnEnviar">Enviar</button>
        <button type="reset" id="btnLimpiar">Limpiar</button>

    </form>
    <section id="resultadoFormulario" aria-live="polite" hidden>
        <h2>Datos obtenidos del formulario</h2>
 
        <table border="1">
            <thead>
                <tr>
                    <th>Campo</th>
                    <th>Valor</th>
                    <th>Tipo JavaScript</th>
                </tr>
            </thead>
 
            <tbody id="cuerpoResultado">
            </tbody>
        </table>
    </section>
    <script src="js/clase1.js"></script>
</body>
</html>
